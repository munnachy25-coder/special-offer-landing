<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Special Offer</title>
<meta name="description" content="Check out the latest available special offer.">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1b8f;
  color:#fff;
  min-height:100vh;
}
.page{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:18px;
}
.banner{
  width:100%;
  max-width:1200px;
  display:block;
  border-radius:18px;
  box-shadow:0 14px 40px rgba(0,0,0,.3);
}
.cta-wrap{
  width:100%;
  max-width:620px;
  margin:-55px auto 0;
  position:relative;
  z-index:2;
  text-align:center;
}
.cta{
  display:block;
  width:100%;
  padding:19px 24px;
  border-radius:15px;
  background:linear-gradient(90deg,#ff3b30,#ed0a72);
  color:#fff;
  text-decoration:none;
  font-size:25px;
  font-weight:800;
  box-shadow:0 10px 28px rgba(0,0,0,.3);
  animation:pulse 1.8s infinite;
}
.cta small{
  display:block;
  font-size:13px;
  font-weight:600;
  letter-spacing:1px;
  margin-top:4px;
}
.note{
  margin:18px 0 8px;
  font-size:13px;
  color:#d8ddff;
  text-align:center;
}
@keyframes pulse{
  0%{transform:scale(1);box-shadow:0 10px 28px rgba(0,0,0,.3)}
  50%{transform:scale(1.02);box-shadow:0 14px 34px rgba(255,40,100,.35)}
  100%{transform:scale(1);box-shadow:0 10px 28px rgba(0,0,0,.3)}
}
@media(max-width:600px){
  .page{padding:8px}
  .banner{border-radius:10px}
  .cta-wrap{margin:-20px 10px 0}
  .cta{font-size:20px;padding:16px}
  .cta small{font-size:11px}
}
</style>
</head>
<body>
<main class="page">
  <img class="banner" src="banner.png" alt="Special Offer">
  <div class="cta-wrap">
    <a class="cta"
       href="https://www.profitableratecpmnetwork.com/xf8s0kzv?key=fa22bc9f6d8b9d6327c3a31a5152ca22"
       target="_blank"
       rel="nofollow sponsored noopener">
      🚀 CONTINUE
      <small>CHECK OFFER NOW</small>
    </a>
  </div>
  <p class="note">You will be redirected to the offer page.</p>
</main>
</body>
</html>
